name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Fetch private game files
        env:
          GAME_FILES_ARCHIVE_URL: ${{ secrets.GAME_FILES_ARCHIVE_URL }}
        run: |
          test -n "$GAME_FILES_ARCHIVE_URL" || {
            echo "Set the GAME_FILES_ARCHIVE_URL repository Actions secret to your Drive link."
            exit 1
          }
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install --disable-pip-version-check gdown
          "$RUNNER_TEMP/gdown-venv/bin/gdown" "$GAME_FILES_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/game-inputs.archive"
          if /usr/bin/unzip -tq "$RUNNER_TEMP/game-inputs.archive" >/dev/null 2>&1; then
            /usr/bin/unzip -q "$RUNNER_TEMP/game-inputs.archive" -d "$GITHUB_WORKSPACE"
          else
            tar -xzf "$RUNNER_TEMP/game-inputs.archive" -C "$GITHUB_WORKSPACE"
          fi

          for file in prod.keys base.nsp base.nsz update.nsp update.nsz upd4-0-1.nsp upd4-0-1.nsz; do
            if [[ ! -f "$file" ]]; then
              nested_file="$(find "$GITHUB_WORKSPACE" -type f -name "$file" -print -quit)"
              if [[ -n "$nested_file" ]]; then
                cp "$nested_file" "$GITHUB_WORKSPACE/$file"
              fi
            fi
          done

          if [[ -f base.nsz || -f update.nsz || -f upd4-0-1.nsz ]]; then
            python3 -m venv "$RUNNER_TEMP/nsz-venv"
            "$RUNNER_TEMP/nsz-venv/bin/pip" install --disable-pip-version-check nsz
            for file in base.nsz update.nsz upd4-0-1.nsz; do
              if [[ -f "$file" ]]; then
                "$RUNNER_TEMP/nsz-venv/bin/nsz" -D "$file"
              fi
            done
          fi

          missing_inputs=()
          [[ -f base.nsp ]] || missing_inputs+=("base.nsp or base.nsz")
          [[ -f prod.keys ]] || missing_inputs+=("prod.keys")
          [[ -f update.nsp || -f upd4-0-1.nsp ]] || missing_inputs+=("update.nsp/update.nsz or upd4-0-1.nsp/upd4-0-1.nsz")
          if (( ${#missing_inputs[@]} > 0 )); then
            echo "::error::Missing required archive inputs: ${missing_inputs[*]}. Use these exact filenames."
            echo "Matching files found in the archive:"
            find "$GITHUB_WORKSPACE" -type f \( -name 'base.*' -o -name 'prod.keys' -o -name 'update.*' -o -name 'upd4-0-1.*' \) -print
            exit 1
          fi

      - name: Build IPA
        run: ./make-ios.sh --ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 3